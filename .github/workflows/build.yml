# ─────────────────────────────────────────────────────────────────
# AppleMusic Downloader — Build & CI
#
# Triggers:
#   - push to any branch (uses code from that specific commit/branch)
#   - pull_request to any branch
#   - manual trigger via workflow_dispatch
# ─────────────────────────────────────────────────────────────────

name: Build & Test

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 20

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint & Test (fast, runs first)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"

      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: src/frontend
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # Build matrix: Linux · macOS · Windows
  # ─────────────────────────────────────────────────────────────
  build:
    name: "Build (${{ matrix.os }})"
    needs: [lint]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: AppleMusicDownloader-linux-x64
          - os: macos
            runner: macos-14
            artifact: AppleMusicDownloader-macos-arm64.dmg
          - os: windows
            runner: windows-latest
            artifact: AppleMusicDownloader-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build
        shell: bash
        env:
          BUILD_OS: ${{ matrix.os }}
        run: bash scripts/build.sh "$BUILD_OS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          if-no-files-found: error
