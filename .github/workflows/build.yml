# ─────────────────────────────────────────────────────────────────
# AppleMusic Downloader — CI
#
# Keep routine CI cheap:
#   - pull requests targeting master run lint/type checks only
#   - full platform builds run on manual workflow_dispatch
#   - documentation-only pull requests are skipped
#   - release builds live in release.yml
# ─────────────────────────────────────────────────────────────────

name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - LICENSE
      - SECURITY.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: 20

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lint & Test (fast, runs first)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"

      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Python tests
        run: python -m unittest discover -s tests -v

  # ─────────────────────────────────────────────────────────────
  # Build matrix: Linux · macOS · Windows
  # ─────────────────────────────────────────────────────────────
  build:
    name: "Build (${{ matrix.os }})"
    needs: [lint]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            artifact: AppleMusicDownloader-linux-x64
          - os: macos-arm64
            runner: macos-latest
            build_platform: macos-arm64
            artifact: AppleMusicDownloader-macos-arm64.dmg
          - os: macos-x64
            runner: macos-26-intel
            build_platform: macos-x64
            artifact: AppleMusicDownloader-macos-x64.dmg
          - os: windows
            runner: windows-latest
            artifact: AppleMusicDownloader-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build
        shell: bash
        env:
          BUILD_OS: ${{ matrix.build_platform || matrix.os }}
        run: bash scripts/build.sh "$BUILD_OS"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}*
          if-no-files-found: error
