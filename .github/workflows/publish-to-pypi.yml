name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build flit_core

      - name: Verify version from __init__.py
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/amdl/__init__.py)"

          if [ -z "$VERSION" ] || ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid __version__ in src/amdl/__init__.py: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Release tag $TAG does not exist"
            exit 1
          fi
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Release tag $TAG does not point to the checked-out commit"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version from src/amdl/__init__.py: $VERSION"

      - name: Build package
        run: python -m build

      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install twine
          twine check dist/*
          python -c "
          import glob, os
          expected = os.environ['EXPECTED_VERSION']
          files = glob.glob('dist/*')
          for f in files:
              if expected not in f:
                  print(f'WARNING: {f} does not contain version {expected}')
          print('Version check passed')
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
