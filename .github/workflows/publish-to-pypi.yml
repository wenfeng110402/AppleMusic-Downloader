name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g., v1.0.0). The leading v is stripped.'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for tag resolution

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build flit_core

      - name: Resolve version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not determine version"
            exit 1
          fi
          # Validate version looks like a semver
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Update __version__ in __init__.py
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -c "
          import re, pathlib, os
          v = os.environ['VERSION']
          p = pathlib.Path('src/amdl/__init__.py')
          text = p.read_text()
          text = re.sub(r'__version__\s*=\s*\"[^\"]*\"', f'__version__ = \"{v}\"', text)
          p.write_text(text)
          print(f'Updated __version__ to {v}')
          "

      - name: Build package
        run: python -m build

      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install twine
          twine check dist/*
          python -c "
          import glob, os
          expected = os.environ['EXPECTED_VERSION']
          files = glob.glob('dist/*')
          for f in files:
              if expected not in f:
                  print(f'WARNING: {f} does not contain version {expected}')
          print('Version check passed')
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
